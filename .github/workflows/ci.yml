name: CelarPass Core CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: 📥 Clonar el repositorio
      uses: actions/checkout@v4

    - name: ⚙️ Configurar Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip' # Acelera las ejecuciones almacenando dependencias en caché

    - name: 🖥️ Instalar dependencias del sistema (Qt/PySide6)
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libxcb-xinerama0

    - name: 📦 Instalar dependencias de Python
      run: |
        python -m pip install --upgrade pip
        pip install zxcvbn cryptography requests argon2-cffi PySide6 platformdirs qrcode
        rm -rf celarpass_core
        git clone https://github.com/Eduardo-ci/celarpass_core.git celarpass_core
        pip install -e celarpass_core

    - name: 🧪 Ejecutar Pruebas Unitarias
      env:
        QT_QPA_PLATFORM: offscreen
        PYTHONPATH: .
      run: |
        python -m unittest discover -s tests -v