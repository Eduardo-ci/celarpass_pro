name: CelarPass Core CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: 📥 Clonar el repositorio
      uses: actions/checkout@v7

    - name: ⚙️ Configurar Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip' # Acelera las ejecuciones almacenando dependencias en caché

    - name: 📦 Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install zxcvbn cryptography requests argon2-cffi PySide6 platformdirs

    - name: 🧪 Ejecutar Pruebas Unitarias
      run: |
        python -m unittest discover -s tests -v